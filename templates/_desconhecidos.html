{% if desconhecidos %}
<table>
  <tr><th>UID</th><th>Última leitura</th><th>Porta (laboratório)</th><th class="col-x"></th></tr>
  {% for d in desconhecidos %}
  <tr>
    <td data-label="Crachá (UID)"><code>{{ d['uid'] }}</code></td>
    <td data-label="Última leitura">{{ d['ultima'] }}</td>
    <td data-label="Porta (laboratório)">{{ d['lab_nome'] or '—' }}</td>
    <td class="col-x">
      <form class="inline" method="post" action="{{ url_for('apagar_cracha_desconhecido') }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="uid" value="{{ d['uid'] }}">
        <button class="x-apagar" type="submit" title="Apagar este registro" aria-label="Apagar o registro {{ d['uid'] }}"><svg class="icone-x" width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% else %}<p>Nenhum crachá desconhecido foi lido ainda.</p>{% endif %}
